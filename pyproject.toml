[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dispatch-log"
version = "0.1.0"
description = "Local, opt-in records of controller dispatches"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
dlog = "dispatch_log.cli:main"

[tool.setuptools.packages.find]
include = ["dispatch_log*"]
